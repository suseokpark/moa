<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>Moa 브라우저 검증</title>
<style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 20px}iframe{width:100%;height:850px;border:1px solid #ddd;border-radius:8px}li{padding:7px}button{padding:9px 14px}pre{white-space:pre-wrap;color:#444}.pass{color:#16713b}.fail{color:#b42318}</style>
<h1>Moa 0.1.9 브라우저 검증</h1>
<p>실제 화면 코드와 로컬 테스트 저장소로 8개 시나리오를 실행합니다. 실제 Notion 계정 데이터에는 접근하지 않습니다.</p>
<button id="run">전체 검사 실행</button><ol id="results"></ol><iframe title="검사 중인 화면"></iframe>
<script>
const suites=[['직접 저장 · 추가/접기/삭제/복구','browser-interaction-fixture.html'],['이전 프로필 데이터 호환','browser-interaction-fixture.html?legacy'],['저장 실패 시 원본 보존','browser-smoke-fixture.html'],['키보드 · 폼 · 선택기','browser-view-usability-fixture.html'],['좁은 화면 · 40개 · 확대 · 다크','browser-layout-fixture.html'],['실제 아이콘 구조 · 설명 문구 · 복합 이모지','browser-icon-fixture.html'],['현재 페이지 · 하위 트리 · 안전한 링크','browser-page-navigation-fixture.html'],['제목 보관 · 복원 · 원본 목록 접기','browser-title-cache-fixture.html']];
const run=document.querySelector('#run'),results=document.querySelector('#results'),frame=document.querySelector('iframe');
run.onclick=async()=>{run.disabled=true;results.replaceChildren();let failures=0;
 for(const [name,path]of suites){const row=document.createElement('li');row.textContent=name+' — 실행 중';results.append(row);frame.src=path;
  await new Promise(resolve=>frame.onload=resolve);let state;
  for(let i=0;i<600;i++){const doc=frame.contentDocument;state=doc.body.dataset.smoke||(doc.title.startsWith('PASS')?'pass':doc.title.startsWith('FAIL')?'fail':null);if(state)break;await new Promise(resolve=>setTimeout(resolve,100));}
  const pass=state==='pass';if(!pass)failures++;row.className=pass?'pass':'fail';row.textContent=name+' — '+(pass?'통과':'실패');
  if(!pass){const detail=document.createElement('pre');detail.textContent=frame.contentDocument.querySelector('#smoke-result,#result')?.textContent||frame.contentDocument.body.innerText;row.append(detail);}
 }
 document.body.dataset.smoke=failures?'fail':'pass';document.title=failures?'FAIL: Moa browser suite':`PASS ${suites.length}/${suites.length}: Moa browser suite`;run.disabled=false;};
</script>
</html>
