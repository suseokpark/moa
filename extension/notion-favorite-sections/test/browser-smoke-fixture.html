<!doctype html>
<html lang="ko" data-workspace-id="0123456789abcdef0123456789abcdef">
  <head>
    <meta charset="utf-8" />
    <title>Moa smoke fixture</title>
    <link rel="stylesheet" href="../src/content.css?v=0.1.9-title-cache" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { min-width: 720px; background: rgb(255, 255, 255); }
      nav[aria-label="Notion sidebar"] {
        display: flex;
        width: 320px;
        height: 560px;
        flex-direction: column;
        overflow: hidden;
        background: rgb(247, 247, 245);
      }
      [data-fixture-primary-navigation] {
        min-height: 40px;
        flex: 0 0 40px;
        align-items: center;
      }
      [data-fixture-primary-navigation] [role="tab"] {
        min-height: 32px;
        padding: 7px 12px;
      }
      [data-fixture-content-surface] {
        width: 100%;
        min-height: 0;
        flex: 1 1 auto;
        overflow: hidden;
      }
      [data-fixture-native-panel] {
        display: flex;
        min-height: 100%;
        flex-direction: column;
        background: rgb(247, 247, 245);
      }
      [aria-label="Favorites"] { padding: 8px; }
      [data-fixture-native-row] { padding: 6px; }
      [data-fixture-underlay-probe] {
        position: absolute;
        z-index: 10;
        right: 12px;
        bottom: 12px;
        width: 112px;
        height: 44px;
        border: 3px solid rgb(0, 0, 0);
        background: rgb(255, 0, 128);
        color: rgb(255, 255, 255);
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Notion sidebar">
      <div
        data-fixture-primary-navigation
        role="tablist"
        aria-label="Sidebar navigation"
        style="display: flex"
      >
        <div data-fixture-home-wrapper style="display: contents">
          <div
            id="fixture-home-tab"
            role="tab"
            aria-label="Home"
            aria-controls="fixture-home-panel"
            aria-selected="true"
            tabindex="0"
          >Home</div>
        </div>
        <div data-fixture-inbox-wrapper style="display: contents">
          <div data-fixture-inbox-inner style="display: contents">
            <div role="tab" aria-label="Inbox" aria-selected="false" tabindex="0">Inbox</div>
          </div>
        </div>
      </div>

      <div
        data-fixture-content-surface
        style="display: flex; flex-direction: column; position: relative"
      >
        <div
          data-fixture-native-panel
          id="fixture-home-panel"
          role="tabpanel"
          aria-labelledby="fixture-home-tab"
        >
          <section role="group" aria-label="Favorites">
            <button type="button" aria-label="Favorites">Favorites</button>
            <div data-fixture-native-row>
              <a href="https://app.notion.com/acme/Roadmap-0123456789abcdef0123456789abcdef">
                <span role="img" aria-label="🗺️">🗺️</span>
                <span data-testid="page-title">Roadmap</span>
              </a>
            </div>
            <div data-fixture-native-row>
              <a href="https://app.notion.com/acme/Decisions-fedcba9876543210fedcba9876543210">
                <span role="img" aria-label="📘">📘</span>
                <span data-testid="page-title">Decisions</span>
              </a>
            </div>
          </section>
          <button data-fixture-underlay-probe type="button">UNDERLAY</button>
        </div>
      </div>
    </nav>

    <output id="smoke-result">pending</output>

    <script>
      let fixtureUnderlayClickCount = 0;
      const fixtureUnderlayProbe = document.querySelector(
        "[data-fixture-underlay-probe]"
      );
      const fixtureNativePanel = document.querySelector(
        "[data-fixture-native-panel]"
      );
      const fixtureNativePanelMarkup = fixtureNativePanel.innerHTML;
      const fixtureNativeRows = [
        ...document.querySelectorAll("[data-fixture-native-row]")
      ];
      fixtureNativePanel.addEventListener("click", (event) => {
        event.preventDefault();
        fixtureUnderlayClickCount += 1;
      });
    </script>
    <script src="../src/favorite-tree-model.js?v=0.1.9-title-cache"></script>
    <script src="../src/profile-catalog.js?v=0.1.9-title-cache"></script>
    <script src="../src/notion-sidebar-adapter.js?v=0.1.9-title-cache"></script>
    <script src="../src/favorite-tree-view.js?v=0.1.9-title-cache"></script>
    <script src="../src/moa-brand.js?v=0.1.9-title-cache"></script>
    <script src="../src/notion-tree-panel.js?v=0.1.9-title-cache"></script>
    <script src="../src/content.js?v=0.1.9-title-cache"></script>
    <script>
      window.setTimeout(async () => {
        try {
          const primaryNavigation = document.querySelector(
            "[data-fixture-primary-navigation]"
          );
          const contentSurface = document.querySelector(
            "[data-fixture-content-surface]"
          );
          const selectedNativeTab = primaryNavigation.querySelector(
            '[role="tab"][aria-selected="true"]'
          );
          const nativeTabpanel = document.querySelector(
            "[data-fixture-native-panel]"
          );
          const inbox = primaryNavigation.querySelector('[role="tab"][aria-label="Inbox"]');
          const menuHost = primaryNavigation.querySelector(
            "[data-notion-tree-primary-navigation-host]"
          );
          const triggerRoot = menuHost?.shadowRoot;
          const trigger = triggerRoot?.querySelector('button[aria-label="Moa"]');
          const viewHost = [...contentSurface.children].find((child) =>
            child.hasAttribute("data-notion-tree-primary-navigation-view-host")
          );
          const panelRoot = viewHost?.shadowRoot;
          const panel = panelRoot?.querySelector(".ntree-panel");
          const panelInitiallyHidden = Boolean(
            viewHost?.hidden &&
              panel?.hidden &&
              panel.getAttribute("aria-hidden") === "true"
          );
          const probeRect = fixtureUnderlayProbe.getBoundingClientRect();
          const probeX = probeRect.left + probeRect.width / 2;
          const probeY = probeRect.top + probeRect.height / 2;
          const probeHitBeforeOpen = document.elementFromPoint(probeX, probeY);

          trigger.click();
          await new Promise((resolve) => window.setTimeout(resolve, 80));
          const panelOpened = Boolean(
            !viewHost.hidden &&
              !panel.hidden &&
              panel.getAttribute("aria-hidden") === "false" &&
              trigger.getAttribute("aria-expanded") === "true" &&
              !trigger.hasAttribute("aria-selected")
          );
          const contentHost = panelRoot.querySelector(
            "[data-notion-tree-panel-content-host]"
          );
          const treeRoot = contentHost?.shadowRoot;
          const text = treeRoot?.textContent || "";
          const addButton = treeRoot?.querySelector(
            'button[aria-label="Notion 즐겨찾기 추가"]'
          );
          const refreshButton = treeRoot?.querySelector(
            'button[aria-label="즐겨찾기 목록 갱신"]'
          );
          const resetButton = treeRoot?.querySelector(
            'button[aria-label="즐겨찾기 트리 초기화"]'
          );
          const nativeRowsStructurallyPreserved = Boolean(
            fixtureNativePanel.innerHTML === fixtureNativePanelMarkup &&
              fixtureNativeRows.every(
                (row) =>
                  row.isConnected &&
                  !row.hasAttribute("data-notion-favorite-sections-native-hidden") &&
                  getComputedStyle(row).display !== "none"
              )
          );
          const surfaceRect = contentSurface.getBoundingClientRect();
          const viewRect = viewHost.getBoundingClientRect();
          const overlayCoversContentSurface = Boolean(
            viewRect.width > 0 &&
              viewRect.height > 0 &&
              viewRect.left <= surfaceRect.left + 1 &&
              viewRect.top <= surfaceRect.top + 1 &&
              viewRect.right >= surfaceRect.right - 1 &&
              viewRect.bottom >= surfaceRect.bottom - 1
          );
          const viewStyle = getComputedStyle(viewHost);
          const panelStyle = getComputedStyle(panel);
          const overlayHasOpaqueBackground = Boolean(
            viewStyle.opacity === "1" &&
              panelStyle.opacity === "1" &&
              viewStyle.backgroundColor !== "transparent" &&
              panelStyle.backgroundColor !== "transparent" &&
              !/^rgba\([^)]*,\s*(?:0|0?\.[0-9]+)\s*\)$/u.test(
                viewStyle.backgroundColor
              ) &&
              !/^rgba\([^)]*,\s*(?:0|0?\.[0-9]+)\s*\)$/u.test(
                panelStyle.backgroundColor
              )
          );
          const probeHitWhileOpen = document.elementFromPoint(probeX, probeY);
          probeHitWhileOpen?.dispatchEvent(
            new MouseEvent("click", {
              bubbles: true,
              composed: true,
              clientX: probeX,
              clientY: probeY
            })
          );
          const underlayBlockedWhileOpen = Boolean(
            probeHitBeforeOpen &&
              fixtureNativePanel.contains(probeHitBeforeOpen) &&
              probeHitWhileOpen &&
              !fixtureNativePanel.contains(probeHitWhileOpen) &&
              fixtureUnderlayClickCount === 0 &&
              !viewHost.hidden
          );
          const semanticPrimaryNavigation = Boolean(
            primaryNavigation.getAttribute("role") === "tablist" &&
              getComputedStyle(primaryNavigation).display === "flex" &&
              getComputedStyle(inbox.parentElement).display === "contents" &&
              getComputedStyle(inbox.parentElement.parentElement).display ===
                "contents" &&
              menuHost?.previousElementSibling === inbox.parentElement.parentElement &&
              selectedNativeTab?.id &&
              selectedNativeTab.getAttribute("aria-controls") === nativeTabpanel?.id &&
              nativeTabpanel?.tagName === "DIV" &&
              nativeTabpanel.getAttribute("role") === "tabpanel" &&
              nativeTabpanel.getAttribute("aria-labelledby") === selectedNativeTab.id &&
              nativeTabpanel.parentElement === contentSurface &&
              getComputedStyle(contentSurface).display === "flex" &&
              getComputedStyle(contentSurface).flexDirection === "column" &&
              getComputedStyle(contentSurface).position === "relative" &&
              viewHost?.parentElement === contentSurface &&
              contentSurface.lastElementChild === viewHost
          );
          const closeButton = panelRoot.querySelector(
            'button[aria-label="Moa 패널 닫기"]'
          );
          closeButton.click();
          await new Promise((resolve) => window.setTimeout(resolve, 30));
          const probeHitAfterClose = document.elementFromPoint(probeX, probeY);
          probeHitAfterClose?.click();
          const closeRestoredNativeSurface = Boolean(
            viewHost.hidden &&
              panel.hidden &&
              probeHitAfterClose &&
              fixtureNativePanel.contains(probeHitAfterClose) &&
              fixtureUnderlayClickCount === 1 &&
              fixtureNativePanel.innerHTML === fixtureNativePanelMarkup
          );
          const passed = Boolean(
            semanticPrimaryNavigation &&
              panelInitiallyHidden &&
              panelOpened &&
              overlayCoversContentSurface &&
              overlayHasOpaqueBackground &&
              underlayBlockedWhileOpen &&
              !text.includes("미분류 그룹") &&
              !text.includes("미분류 섹션") &&
              treeRoot?.querySelector(".nfs-onboarding") &&
              addButton?.disabled &&
              refreshButton?.disabled &&
              resetButton?.disabled &&
              treeRoot?.querySelectorAll(".nfs-favorite").length === 0 &&
              nativeRowsStructurallyPreserved &&
              closeRestoredNativeSurface &&
              !document.querySelector("[data-notion-favorite-sections-host]")
          );

          document.body.dataset.smoke = passed ? "pass" : "fail";
          document.querySelector("#smoke-result").textContent = passed
            ? "PASS: Moa internal surface failed open with disabled controls and native DOM preserved"
            : `FAIL: ${text}`;
        } catch (error) {
          document.body.dataset.smoke = "fail";
          document.querySelector("#smoke-result").textContent = `FAIL: ${error.message}`;
        }
      }, 1000);
    </script>
  </body>
</html>
